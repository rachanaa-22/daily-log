name: Daily activity
on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > activity-log.txt
          git config user.name "rachanaa-22"
          git config user.email "90711391+rachanaa-22@users.noreply.github.com"
          git add activity-log.txt
          git commit -m "Daily log $(date -u +%F)"
          git push
